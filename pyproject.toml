[project]
name = "d2b"
version = "0.1.0"
description = "Engineering drawing in, editable CadQuery program out, verified geometrically."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.10.0",
    "cadquery>=2.8.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "ray>=2.60.0",
    "scipy>=1.18.1",
    "trimesh>=5.2.1",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.16.0",
    "peft>=0.22.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2b"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown files quote converter output exactly as generated, so leave their code blocks alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
